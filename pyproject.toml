[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mudm-paper-code"
version = "1.0.0"
description = "Companion code to reproduce the quantitative results (Table 1, Extended Data) of the muDM paper."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    # Pinned to the exact releases used for the paper (public on PyPI).
    "mudm==0.6.1",
    "mudm-tools==0.6.3",
    # Analysis stack for the economy sweep.
    "torch>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8", "shapely>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
mudm-run-manc = "mudm_paper.run_manc:main"

[tool.hatch.build.targets.wheel]
packages = ["mudm_paper"]

[tool.pytest.ini_options]
testpaths = ["mudm_paper/tests"]
